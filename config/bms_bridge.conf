# bms_bridge configuration
#
# Required: device_uuid, uart_device, uart_baud.
# Everything else has a built-in default and can be left commented out.

# ---- BLE -------------------------------------------------------------------
# BLE address of the JK BMS (MAC on Linux, e.g. "C8:47:8C:11:22:33").
# Can be overridden by -U on the command line. REQUIRED.
device_uuid = "00:00:00:00:00:00"

# GATT service / characteristics. Defaults match stock JK BMS firmware.
# service_uuid       = "0000ffe0-0000-1000-8000-00805f9b34fb"
# char_write_uuid    = "0000ffe1-0000-1000-8000-00805f9b34fb"
# char_notify_uuid   = "0000ffe1-0000-1000-8000-00805f9b34fb"

# How long to scan before giving up (ms).
# scan_timeout_ms      = 10000

# How often to retry detecting a BT adapter when none is present (ms).
# adapter_poll_ms      = 2000

# Backoff between reconnect attempts after a connection failure or drop (ms).
# reconnect_backoff_ms = 5000

# How often to poll the BMS for a fresh telemetry frame. Also the minimum
# interval between history DB writes (ms).
# bms_poll_period_ms   = 5000

# How often SharedState (used by the inverter responder) is refreshed from
# incoming BLE frames. JK firmware pushes frames unsolicited at ~2 fps;
# throttling here prevents the dispatcher from being overwhelmed (ms).
# bms_state_update_interval_ms = 500

# How often to re-request device_info so changes made in the JK app
# eventually flow into cached settings (ms).
# settings_refresh_period_ms = 60000

# ---- Inverter (Pylontech RS485 over UART) ----------------------------------
# Serial device the inverter is attached to. REQUIRED.
uart_device = "/dev/ttyUSB0"

# Baud rate. REQUIRED. Pylontech US-series: 115200; older units: 9600.
uart_baud   = 115200


# ---- Logging ---------------------------------------------------------------
# Verbosity: 1=error 2=warning 3=info 4=debug 5=trace. -D flag overrides.
# log_level = 3

# Log file path. Empty = stdout only. When set, duplicated to file (append).
# log_file  = ""

# ---- Telemetry history -----------------------------------------------------
# SQLite file for telemetry samples. Can be overridden with -d on the command
# line. The systemd unit creates /var/lib/bms_bridge via StateDirectory=.
# history_db_path      = "/var/lib/bms_bridge/history.sqlite3"

# In-memory ring buffer size (seconds). Queries within this window are served
# from RAM; older data is read from SQLite.
# history_ram_window_s = 86400

# ---- HTTP dashboard --------------------------------------------------------
# TCP port the built-in web server listens on.
# http_port = 80

# Directory served as the web root. Must contain index.html.
# www_root  = "/usr/share/bms_bridge/www"

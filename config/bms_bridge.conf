# bms_bridge configuration

# BLE address of the JKBMS device (MAC on Linux, e.g. "C8:47:8C:11:22:33")
# Can be overridden by -U command-line flag.
# device_uuid = "00:00:00:00:00:00"

# Logging verbosity: 1=error, 2=warning, 3=info, 4=debug, 5=trace
# Can be overridden by -D command-line flag.
log_level = 4

# Optional log file. If empty, logs go to stdout only.
# When set, output is duplicated to both stdout and this file (append mode).
log_file = ""

# JKBMS GATT service / characteristics. REQUIRED — no built-in defaults.
# The values below match stock JK BMS firmware; adjust if your hardware differs.
service_uuid       = "0000ffe0-0000-1000-8000-00805f9b34fb"
char_write_uuid    = "0000ffe1-0000-1000-8000-00805f9b34fb"
char_notify_uuid   = "0000ffe1-0000-1000-8000-00805f9b34fb"

# How long to scan before giving up (milliseconds)
scan_timeout_ms      = 10000

# How often to retry detecting a BT adapter when none is present.
adapter_poll_ms      = 2000

# Backoff between reconnect attempts after a connection failure or drop.
reconnect_backoff_ms = 5000

# How often the dispatcher pokes the BMS for a fresh telemetry frame.
bms_poll_period_ms   = 5000

# How often we re-request device_info (which also brings the settings frame),
# so that limit changes the operator makes in the JK app eventually flow into
# our cached values. Settings change rarely — once a minute is plenty.
settings_refresh_period_ms = 60000

# ---- Inverter (Pylontech RS485 over UART) ----------------------------------
# Serial device the inverter is attached to.
uart_device          = "/dev/ttyUSB0"

# Baud rate. Pylontech US-series typically runs at 115200; older units 9600.
uart_baud            = 115200

# Address we masquerade as on the RS485 bus. The inverter scans 0x02..0x0F
# (or further) until it gets a reply; whichever address replies first
# becomes "the master battery". Default 2 follows Pylontech convention
# (first battery starts from 2). The emulator may also answer on subsequent
# addresses when the pack is too large to fit a single module's u16-mAh
# capacity field — in that case it presents as a virtual N-module rack
# (N is computed from the BMS-reported capacity at run time).
pylontech_address    = 2

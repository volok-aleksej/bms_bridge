# bms_bridge configuration

# ---- Logging (global) ------------------------------------------------------
# Verbosity: 1=error 2=warning 3=info 4=debug 5=trace. -D flag overrides.
log_level = 4

# Log file path. Empty = stdout only. When set, duplicated to file (append).
# log_file = ""

# ---- Batteries -------------------------------------------------------------
# Every block requires: type, address, capacity, protocol.
#   type     — link: "bluetooth" | "ttl" | "reserve"
#   address  — bluetooth: MAC; ttl: device path; reserve: informative tag
#   capacity — declared capacity; used only for "reserve" (monitored
#              batteries report their own capacity)
#   protocol — "jk_bt" | "pylontech"; unused for "reserve"

batery "15kWt" {
    type     = "bluetooth"
    address  = "12:45:45:12:12:12"
    capacity = 314
    protocol = "jk_bt"

    # optional, bluetooth-specific (defaults match stock JK BMS firmware)
    # service_uuid       = "0000ffe0-0000-1000-8000-00805f9b34fb"
    # char_write_uuid    = "0000ffe1-0000-1000-8000-00805f9b34fb"
    # char_notify_uuid   = "0000ffe1-0000-1000-8000-00805f9b34fb"
    # scan_timeout_ms    = 10000
    # adapter_poll_ms    = 2000

    # optional, common
    # reconnect_ms               = 5000
    # bms_poll_period_ms         = 5000
    # settings_refresh_period_ms = 60000
}

batery "4.8kWt" {
    type     = "reserve"        # no monitoring — no poll parameters
    address  = "sacred_sun"     # informative only
    capacity = 100              # required for reserve
    protocol = ""               # unused for reserve

    # Battery to mirror (voltage / cells / temps come from it). The reserve
    # is exposed to the inverter at SoC 100%, zero current, and a 0.5C
    # charge/discharge current limit derived from its own capacity.
    mirror   = "15kWt"
}

batery "virtual" {
    type     = "ttl"
    address  = "/dev/ttyUSB1"   # fs path to the serial device
    capacity = 200
    protocol = "pylontech"

    # module address as set on the battery, 1..16 (required for pylontech).
    # On the wire the bridge polls address+1 (the protocol numbers from 2).
    pylontech_address = 1

    # optional, common
    # reconnect_ms               = 5000
    # bms_poll_period_ms         = 5000
    # settings_refresh_period_ms = 60000

    # optional, ttl-specific
    # uart_baud = 115200
}

# ---- Inverter (Pylontech RS485 over UART) ----------------------------------
# Outbound link the inverter polls us on. uart is REQUIRED.
inverter {
    uart = "/dev/ttyUSB0"
    baud = 115200           # Pylontech US-series: 115200; older units: 9600
}

# ---- HTTP dashboard --------------------------------------------------------
http {
    port     = 80
    www_root = "/usr/share/bms_bridge/www"
}

# ---- Telemetry history -----------------------------------------------------
history {
    db_path      = "/var/lib/bms_bridge/history.sqlite3"
    ram_window_s = 86400
}

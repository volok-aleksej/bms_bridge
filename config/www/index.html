<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMS Bridge</title>
<link rel="stylesheet" href="style.css">
<script defer src="chart.umd.min.js"></script>
<script defer src="alpine.min.js"></script>
</head>
<body x-data="bms()" x-init="init()">

<header>
  <span class="logo">&#9889; BMS Bridge</span>
  <nav class="tabs">
    <button :class="{active: tab==='realtime'}" @click="tab='realtime'">Realtime</button>
    <button :class="{active: tab==='settings'}" @click="tab='settings'">Settings</button>
    <button :class="{active: tab==='history'}"  @click="tab='history'; loadHistory()">History</button>
    <button :class="{active: tab==='energy'}"   @click="tab='energy'; loadEnergy()">Energy</button>
  </nav>
  <span class="hdr-status" x-text="status"></span>
</header>

<!-- ═══════════════════════ BATTERY BAR ════════════════════ -->
<!-- Drives Realtime/Settings only; History always shows all batteries. -->
<!-- Only monitored batteries: legacy is history-only, reserve has no live
     telemetry — both would be empty in Realtime/Settings. -->
<div class="batt-bar" x-show="selectableBatteries().length > 1 && tab !== 'history'">
  <template x-for="b in selectableBatteries()" :key="b.id">
    <button class="batt-chip"
            :class="{active: b.id===battery}"
            @click="selectBattery(b.id)">
      <span x-text="b.legacy || b.name === '' ? 'Archive' : b.name"></span>
    </button>
  </template>
</div>

<!-- ═══════════════════════ REALTIME ═══════════════════════ -->
<div x-show="tab==='realtime'">

  <div class="gauges-row">
    <div class="gauge-wrap">
      <canvas id="gauge-v" width="220" height="140"></canvas>
      <div class="gauge-label">Voltage</div>
      <div class="gauge-reading" x-text="live.voltage_mv ? (live.voltage_mv/1000).toFixed(2)+' V' : '—'"></div>
    </div>
    <div class="gauge-wrap">
      <canvas id="gauge-i" width="220" height="140"></canvas>
      <div class="gauge-label">Current</div>
      <div class="gauge-reading"
           :class="live.current_ma > 0 ? 'pos' : live.current_ma < 0 ? 'neg' : ''"
           x-html="live.current_ma != null && live.voltage_mv != null
             ? (live.current_ma>=0?'+':'')+(live.current_ma/1000).toFixed(2)+' A&nbsp;<span class=\'gauge-kw\'>/ '+(live.current_ma>=0?'+':'')+(live.voltage_mv/1000*live.current_ma/1000/1000).toFixed(3)+' kW</span>'
             : '—'"></div>
    </div>
    <div class="soc-wrap">
      <div class="soc-label">SoC</div>
      <div class="soc-bar-outer">
        <div class="soc-bar-inner" :style="`width:${live.soc_pct||0}%`"></div>
      </div>
      <div class="soc-pct" x-text="live.soc_pct != null ? live.soc_pct+'%' : '—'"></div>
      <div class="soc-cap" x-text="live.remaining_mah != null ? (live.remaining_mah/1000).toFixed(1)+' / '+(live.total_mah/1000).toFixed(1)+' Ah' : ''"></div>
    </div>
  </div>

  <div class="status-strip">
    <span class="flag" :class="live.charging    ? 'on':'off'" x-text="'Charge: '   +(live.charging    ?'ON':'OFF')"></span>
    <span class="flag" :class="live.discharging ? 'on':'off'" x-text="'Discharge: '+(live.discharging ?'ON':'OFF')"></span>
    <span class="flag" :class="live.balancer    ? 'on':'off'" x-text="'Balancer: ' +(live.balancer    ?'ON':'OFF')"></span>
    <span class="muted" x-show="live.balancer" x-text="live.balance_current_ma != null ? (live.balance_current_ma/1000).toFixed(3)+' A' : ''"></span>
    <span class="flag" :class="live.errors      ? 'err':'off'" x-text="'Errors: '  +(live.errors?'0x'+live.errors.toString(16).toUpperCase():'0')"></span>
    <span class="sep"></span>
    <span class="muted" x-text="live.temp1_dc   != null ? 'T1: '  +(live.temp1_dc/10).toFixed(1)+'°C' : ''"></span>
    <span class="muted" x-text="live.temp2_dc   != null ? 'T2: '  +(live.temp2_dc/10).toFixed(1)+'°C' : ''"></span>
    <span class="muted" x-text="live.mos_temp_dc!= null ? 'MOS: ' +(live.mos_temp_dc/10).toFixed(1)+'°C' : ''"></span>
    <span class="sep"></span>
    <span class="muted" x-text="live.avg_cell_mv  != null ? 'Avg: '+live.avg_cell_mv+' mV' : ''"></span>
    <span class="muted" x-text="live.diff_cell_mv != null ? 'ΔU: ' +live.diff_cell_mv+' mV' : ''"></span>
    <span class="sep"></span>
    <span class="muted" x-text="live.cycle_count != null ? 'Cycles: '+live.cycle_count : ''"></span>
  </div>

  <div class="section-title">Cell Voltages</div>
  <div class="cells-grid">
    <template x-for="(mv, i) in live.cells_mv" :key="i">
      <div class="cell-card" :class="cellClass(mv, i)">
        <div class="cell-num"  x-text="String(i+1).padStart(2,'0')"></div>
        <div class="cell-mv"   x-text="(mv/1000).toFixed(3)"></div>
        <div class="cell-mohm" x-text="live.resistance_uohm && live.resistance_uohm[i] != null ? (live.resistance_uohm[i]/1000).toFixed(3)+' mΩ' : ''"></div>
      </div>
    </template>
  </div>

</div>

<!-- ═══════════════════════ SETTINGS ═══════════════════════ -->
<div x-show="tab==='settings'">
  <div class="info-grid">
    <template x-if="!info">
      <div class="info-empty">No data received yet</div>
    </template>
    <template x-if="info">
      <template x-for="row in infoRows()" :key="row[0]">
        <div class="info-row">
          <span class="ir-label" x-text="row[0]"></span>
          <span class="ir-value" x-text="row[1]"></span>
        </div>
      </template>
    </template>
  </div>
</div>

<!-- ═══════════════════════ ENERGY ═════════════════════════ -->
<div x-show="tab==='energy'">
  <div class="energy-toolbar">
    <button @click="prevEnergyMonth()">&larr;</button>
    <span class="energy-month-label" x-text="energyMonthLabel()"></span>
    <button @click="nextEnergyMonth()" :disabled="!canNextEnergyMonth()">&rarr;</button>
    <span class="hdr-status" x-text="energyStatus"></span>
  </div>
  <div class="energy-totals" x-show="energyTotals" x-html="energyTotals"></div>
  <div class="charts">
    <div class="chart-box" style="height:280px"><canvas id="ce"></canvas></div>
  </div>
</div>

<!-- ═══════════════════════ HISTORY ════════════════════════ -->
<div x-show="tab==='history'">
  <div class="history-toolbar">
    <template x-for="h in [1,6,12,24,168]" :key="h">
      <button :class="{on: histHours===h}" @click="histHours=h; loadHistory()"
              x-text="h===1?'1h':h===6?'6h':h===12?'12h':h===24?'24h':'7d'"></button>
    </template>
    <span class="hdr-status" x-text="histStatus"></span>
  </div>
  <div class="charts">
    <div class="chart-box"><canvas id="cv"></canvas></div>
    <div class="chart-box"><canvas id="cc"></canvas></div>
    <div class="chart-box sm"><canvas id="cs"></canvas></div>
    <div class="chart-box"><canvas id="ct"></canvas></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
